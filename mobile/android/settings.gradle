pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id("com.facebook.react.settings")
}
def autolinkFile = file("../autolinking.json")
if (autolinkFile.exists()) {
    extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
        ex.autolinkLibrariesFromConfigFile(autolinkFile)
    }
} else {
    extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
        ex.autolinkLibrariesFromCommand()
    }
}

rootProject.name = 'TaskFlowMobile'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
